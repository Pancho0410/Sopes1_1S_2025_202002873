apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-consumerkafka-deployment
  namespace: proyecto2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-consumerkafka
  template:
    metadata:
      labels:
        app: go-consumerkafka
    spec:
      containers:
      - name: go-consumerkafka
        # image: consumer:latest
        image: 34-173-10-108.sslip.io/sopes1p2/consumer:latest
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"