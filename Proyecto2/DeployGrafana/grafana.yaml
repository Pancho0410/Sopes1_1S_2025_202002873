apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-deployment
  namespace: proyecto2
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana-oss:10.4.2
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: proyecto2
spec:
  selector:
    app: grafana
  ports:
    - protocol: TCP
      # port: 80
      port: 3000            # Puerto accesible externamente
  # type: LoadBalancer  <------ Para minikube
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: proyecto2  
spec:
  ingressClassName: nginx
  rules:
    - host: 34.69.113.160.nip.io 
      http:
        paths:
          - pathType: Prefix
            backend:
              service:
                name: grafana-service
                port:
                  number: 3000
            path: /